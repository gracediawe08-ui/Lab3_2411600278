<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Restaurant Order Manager - Login</title>


    <!-- Bootstrap 5 -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Custom CSS -->

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body class="login-page d-flex align-items-center justify-content-center">


    <div class="container">

        <div class="row justify-content-center">

            <div class="col-12 col-sm-10 col-md-6 col-lg-4">


                <!-- LOGIN CARD -->

                <div class="card login-card shadow">


                    <!-- HEADER -->

                    <div class="card-header login-header text-center">

                    <div class="login-logo">

               <img
                     src="assets/logo.png"
                     alt="Restaurant Order Manager Logo"
                    >

               </div>

               <h3>
                         Restaurant Order Manager
                           
               </h3>

               </div>



                    <!-- BODY -->

                    <div class="card-body p-4">


                        <!-- ALERT -->

                        <div
                            id="alertContainer"
                            class="mb-3"
                        ></div>



                        <!-- LOGIN FORM -->

                        <form
                            id="loginForm"
                            autocomplete="off"
                        >


                            <!-- USERNAME -->

                            <div class="mb-3">

                                <label
                                    for="username"
                                    class="form-label"
                                >
                                    👤 Username
                                </label>


                                <input
                                    type="text"
                                    id="username"
                                    name="username"
                                    class="form-control"
                                    placeholder="Enter username"
                                    autocomplete="off"
                                    value=""
                                    required
                                >


                                <div class="invalid-feedback">

                                    Please enter your username.

                                </div>

                            </div>



                            <!-- PASSWORD -->

                            <div class="mb-3">

                                <label
                                    for="password"
                                    class="form-label"
                                >
                                    🔒 Password
                                </label>


                                <!-- PASSWORD WITH SEE BUTTON -->

                                <div class="password-wrapper">

                                    <input
                                        type="password"
                                        id="password"
                                        name="password"
                                        class="form-control"
                                        placeholder="Enter password"
                                        autocomplete="new-password"
                                        value=""
                                        required
                                    >


                                    <button
                                        type="button"
                                        class="see-password"
                                        id="togglePassword"
                                    >
                                        👁
                                    </button>

                                </div>


                                <div class="invalid-feedback">

                                    Please enter your password.

                                </div>

                            </div>



                            <!-- REMEMBER ME -->

                            <div class="form-check mb-3">

                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    id="rememberMe"
                                    name="rememberMe"
                                >


                                <label
                                    class="form-check-label"
                                    for="rememberMe"
                                >

                                    Remember me

                                </label>

                            </div>



                            <!-- LOGIN BUTTON -->

                            <button
                                type="submit"
                                class="btn login-btn w-100"
                            >

                                Login

                            </button>


                        </form>

                    </div>



    <!-- Bootstrap JavaScript -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- Login JavaScript -->

    <script src="js/login.js"></script>


    <!-- SEE PASSWORD -->

    <script>

        document
            .getElementById("togglePassword")
            .addEventListener("click", function () {

                const password =
                    document.getElementById("password");

                if (password.type === "password") {

                    password.type = "text";

                    this.textContent = "🙈";

                } else {

                    password.type = "password";

                    this.textContent = "👁";

                }

            });

    </script>


</body>

</html>
